# Builds the offline regions (map + road data per German state) with
# Planetiler and publishes them as GitHub release assets:
#   - release "regions-<date>": the .pmtiles files of that build
#   - release "catalog":        catalog.json, which the app reads
# Runs monthly and on demand (Actions → Offline regions → Run workflow).
name: Offline regions

on:
  schedule:
    - cron: '0 2 3 * *' # 3rd of each month, 02:00 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: Geofabrik ids, comma separated (empty = all 16 states)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: offline-regions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      ALL_REGIONS: >-
        baden-wuerttemberg,bayern,berlin,brandenburg,bremen,hamburg,hessen,
        mecklenburg-vorpommern,niedersachsen,nordrhein-westfalen,
        rheinland-pfalz,saarland,sachsen,sachsen-anhalt,schleswig-holstein,
        thueringen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download Planetiler
        run: |
          mkdir -p tool/.cache
          curl -sSfL -o tool/.cache/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # Water polygons, Natural Earth and lake centerlines (~1.5 GB) rarely
      # change; keep them between runs.
      - name: Cache Planetiler sources
        uses: actions/cache@v6
        with:
          path: |
            tool/.cache/data/sources/*.zip
          key: planetiler-sources-${{ github.run_id }}
          restore-keys: planetiler-sources-

      - name: Fetch current catalog
        # Lets a partial run keep the other regions in the catalog.
        run: |
          mkdir -p dist/regions
          gh release download catalog --pattern catalog.json \
            --dir dist/regions || echo "No catalog yet"

      - name: Build regions
        shell: pwsh
        run: |
          $version = Get-Date -Format 'yyyy-MM-dd'
          $tag = "regions-$version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          $list = '${{ github.event.inputs.regions }}'
          if (-not $list) { $list = $env:ALL_REGIONS }
          $regions = $list -split '[,\s]+' | Where-Object { $_ }
          ./tool/build_regions.ps1 -Regions $regions -Memory 12g `
            -Version $version `
            -DownloadBaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"

      - name: Publish release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Offline-Regionen $VERSION" \
              --notes "Karten- und Fahrdaten aus OpenStreetMap (© OpenStreetMap-Mitwirkende, ODbL), Stand $VERSION." \
              --latest=false
          gh release upload "$TAG" dist/regions/*.pmtiles --clobber
          gh release view catalog > /dev/null 2>&1 || \
            gh release create catalog --title "Katalog der Offline-Regionen" \
              --notes "catalog.json für die App. Wird bei jedem Bau ersetzt." \
              --latest=false
          gh release upload catalog dist/regions/catalog.json --clobber

      - name: Delete releases no longer in the catalog
        run: |
          used=$(grep -o 'releases/download/regions-[0-9-]*' dist/regions/catalog.json \
            | sed 's#releases/download/##' | sort -u)
          for tag in $(gh release list --limit 100 --json tagName \
              --jq '.[].tagName | select(startswith("regions-"))'); do
            if ! grep -qx "$tag" <<< "$used"; then
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
