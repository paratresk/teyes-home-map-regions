# Builds the offline regions (map + road data per German state, and Germany
# as a whole) with Planetiler and publishes them as GitHub release assets:
#   - release "regions-<date>": the .pmtiles files of that build
#   - release "catalog":        catalog.json, which the app reads
# Germany's map is larger than GitHub's 2 GiB limit per file, so it is
# published in parts (germany.map.pmtiles.001, .002, ...), which the app
# joins while downloading.
# Runs monthly and on demand (Actions → Offline regions → Run workflow).
name: Offline regions

on:
  schedule:
    - cron: '0 2 3 * *' # 3rd of each month, 02:00 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: >-
          Geofabrik ids, comma separated, "germany" for all of Germany
          (empty = all 16 states and Germany)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: offline-regions
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # Parts stay safely below GitHub's limit of 2 GiB per release asset.
  SPLIT_BYTES: '1900000000'

jobs:
  states:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALL_REGIONS: >-
        baden-wuerttemberg,bayern,berlin,brandenburg,bremen,hamburg,hessen,
        mecklenburg-vorpommern,niedersachsen,nordrhein-westfalen,
        rheinland-pfalz,saarland,sachsen,sachsen-anhalt,schleswig-holstein,
        thueringen
    steps:
      - name: Choose regions
        shell: pwsh
        run: |
          $list = '${{ github.event.inputs.regions }}'
          if (-not $list) { $list = $env:ALL_REGIONS }
          $regions = @($list -split '[,\s]+' | Where-Object { $_ -and $_ -ne 'germany' })
          "REGIONS=$($regions -join ',')" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        if: env.REGIONS != ''

      - uses: actions/setup-java@v6
        if: env.REGIONS != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        if: env.REGIONS != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download Planetiler
        if: env.REGIONS != ''
        run: |
          mkdir -p tool/.cache
          curl -sSfL -o tool/.cache/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      # Water polygons, Natural Earth and lake centerlines (~1.5 GB) rarely
      # change; keep them between runs.
      - name: Cache Planetiler sources
        if: env.REGIONS != ''
        uses: actions/cache@v6
        with:
          path: |
            tool/.cache/data/sources/*.zip
          key: planetiler-sources-${{ github.run_id }}-states
          restore-keys: planetiler-sources-

      - name: Fetch current catalog
        if: env.REGIONS != ''
        # Lets a partial run keep the other regions in the catalog.
        run: |
          mkdir -p dist/regions
          gh release download catalog --pattern catalog.json \
            --dir dist/regions || echo "No catalog yet"

      - name: Build regions
        if: env.REGIONS != ''
        shell: pwsh
        run: |
          $version = Get-Date -Format 'yyyy-MM-dd'
          $tag = "regions-$version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          ./tool/build_regions.ps1 -Regions ($env:REGIONS -split ',') `
            -Memory 12g -Version $version -SplitBytes $env:SPLIT_BYTES `
            -DownloadBaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"

      - name: Publish release
        if: env.REGIONS != ''
        run: ./.github/publish.sh

  # All of Germany on a runner of its own: the extract and Planetiler's
  # temporary files need most of a runner's disk.
  germany:
    needs: states
    if: ${{ !cancelled() && (!github.event.inputs.regions || contains(github.event.inputs.regions, 'germany')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Download Planetiler
        run: |
          mkdir -p tool/.cache
          curl -sSfL -o tool/.cache/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Cache Planetiler sources
        uses: actions/cache@v6
        with:
          path: |
            tool/.cache/data/sources/*.zip
          key: planetiler-sources-${{ github.run_id }}-germany
          restore-keys: planetiler-sources-

      - name: Fetch current catalog
        # Includes the states just published by the job before.
        run: |
          mkdir -p dist/regions
          gh release download catalog --pattern catalog.json \
            --dir dist/regions || echo "No catalog yet"

      - name: Build Germany
        shell: pwsh
        run: |
          $version = Get-Date -Format 'yyyy-MM-dd'
          $tag = "regions-$version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          ./tool/build_regions.ps1 -Regions germany -Memory 10g `
            -Version $version -SplitBytes $env:SPLIT_BYTES `
            -DownloadBaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          df -h /

      - name: Publish release
        run: ./.github/publish.sh
